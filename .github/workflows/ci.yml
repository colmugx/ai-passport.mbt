name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: MoonBit version and dependency update
        run: |
          moon version --all
          moon update

      - name: Check (native)
        run: moon check --target native --output-json

      - name: Test (native)
        run: moon test --target native --output-json

      - name: Check (js)
        run: moon check --target js --output-json

      - name: Test (js)
        run: moon test --target js --output-json

      - name: Refresh generated interfaces and formatting
        run: |
          moon info
          moon fmt

      - name: Fail on uncommitted generator/formatter diff
        run: git diff --exit-code

  wasm-host:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: MoonBit version and dependency update
        run: |
          moon version --all
          moon update

      - name: Check (wasm)
        run: moon check --target wasm --output-json

      - name: Test (wasm)
        run: moon test --target wasm --output-json

      - name: Passport CLI smoke (hosts)
        run: moon run --target wasm src/cmd/passport hosts

      # Run doctor against a clean nested project. doctor uses `moon check` on
      # the declared entry, which both validates it and lets Moon materialize
      # declared dependencies without relying on deprecated installer behavior.
      - name: Passport CLI smoke (doctor on a fresh fixture project)
        run: moon run --target wasm src/cmd/passport doctor --host web --project hosts/web/test/fixtures/fixture-a

      - name: Build fixture wasm (release, then debug)
        run: |
          moon build --target wasm --release
          moon build --target wasm
          ls -l _build/wasm/release/build/fixture/fixture.wasm _build/wasm/debug/build/fixture/fixture.wasm

      - name: Generate PCM test asset
        run: node hosts/web/tools/gen-test-pcm.mjs

      - name: Install pinned playwright and its chromium
        run: npx -y playwright@1.63.0 install chromium --with-deps

      - name: Wasm-host integration suites (incl. real browser + CLI fixtures)
        run: node hosts/web/test/run-tests.mjs

      - name: Package-list proof (runtime present, test-only files absent)
        run: |
          moon package --list > /tmp/passport-package-list.txt 2>&1
          for required in \
            src/cmd/passport/main.mbt \
            src/cmd/passport/moon.pkg \
            src/cli/cli_error.mbt \
            src/hosts/registry.mbt \
            src/application/application.mbt \
            src/runtime/web.mbt \
            src/runtime/device.mbt \
            hosts/web/index.html \
            hosts/web/passport-host.js \
            hosts/web/pcm-worklet.js \
            hosts/folotoy/ai-passport/main/app_main.c \
            hosts/folotoy/ai-passport/components/folotoy_bsp/bsp.sha256 \
            hosts/folotoy/ai-passport/tools/moon_cc_capture.py; do
            grep -x "$required" /tmp/passport-package-list.txt || { echo "MISSING from package: $required"; exit 1; }
          done
          # The archive must carry ai-passport-owned Host glue only: no
          # third-party product or hardware source may ever ship in it.
          if grep -E '(^|/)(external|upstream)/|bsp_[a-z_]+\.c$|folotoy/ai-passport/components/bsp/' /tmp/passport-package-list.txt; then
            echo "THIRD-PARTY source leaked into package"
            exit 1
          fi
          # CLI-generated Host entry adapters are downstream build output;
          # they never ship in the SDK archive.
          if grep -q 'passport-generated/' /tmp/passport-package-list.txt; then
            echo "generated entry adapter leaked into package"
            exit 1
          fi
          for forbidden in \
            hosts/web/test/run-tests.mjs \
            hosts/web/tools/make-bundle.mjs \
            hosts/web/assets/test.pcm \
            hosts/folotoy/ai-passport/components/folotoy_bsp/upstream.cmake \
            hosts/folotoy/ai-passport/test/test_button_bridge_queue.py \
            hosts/folotoy/ai-passport/test/test_display_bridge_dma.py \
            hosts/folotoy/ai-passport/test/test_device_button_contract.py \
            hosts/folotoy/ai-passport/test/test_moon_cc_capture.py \
            hosts/folotoy/ai-passport/test/fixtures/no-audio/moon.mod \
            src/fixture/main.mbt; do
            if grep -x "$forbidden" /tmp/passport-package-list.txt; then
              echo "TEST-ONLY file leaked into package: $forbidden"
              exit 1
            fi
          done
          if grep -E '(_test|_wbtest)\.mbt$' /tmp/passport-package-list.txt; then
            echo "MoonBit test source leaked into package"
            exit 1
          fi
          echo "package-list proof: runtime surface present and test-only files excluded"

  template-integration:
    # Pre-release compatibility gate: the CURRENT public template, compiled
    # and built against THIS unpublished SDK commit. moon.work resolves the
    # SDK checkout as a local module while the template keeps its published
    # registry pin in moon.mod.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: espressif/idf:v5.5.3
    env:
      AI_PASSPORT_SDK: ${{ github.workspace }}/sdk
    steps:
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all

      - name: Check out the SDK
        uses: actions/checkout@v5
        with:
          path: sdk

      - name: Check out the current public template with its FoloToy submodule
        uses: actions/checkout@v5
        with:
          repository: colmugx/ai-passport-template.mbt
          ref: a60da1315907b5cb53dd87e1ddc98676b54721ef
          path: template
          submodules: recursive

      - name: Migrate the pinned public template contract to passport.toml
        run: |
          python3 sdk/.github/scripts/passport-json-to-toml.py template
          test -f template/passport.toml
          test ! -e template/passport.json

      - name: Configure local SDK workspace
        run: |
          rm -rf no-audio
          cp -R sdk/hosts/folotoy/ai-passport/test/fixtures/no-audio no-audio
          rm -rf no-audio/_build no-audio/.mooncakes no-audio/.passport no-audio/src/passport-generated
          cat > moon.work <<'EOF'
          members = [
            "sdk",
            "template",
            "no-audio",
          ]
          EOF
          cat moon.work

      - name: Assert the pinned FoloToy submodule revision
        run: |
          rev="$(git -C template/external/folotoy-ai-passport rev-parse HEAD)"
          echo "external/folotoy-ai-passport @ $rev"
          test "$rev" = "c21a015d44f2bcc02b4d859532d74cd7aefe69be"

      - name: Assert the committed template PCM identity
        run: |
          test "$(sha256sum template/assets/forest_walk.pcm | cut -d' ' -f1)" = "a848e82fa15266fc474ccc2d9656e30ab24081d690d4944767c332fb7866010a"

      # moon.work makes the SDK a local module for both downstream projects.
      # Their registry version pins remain unchanged, but Moon reads THIS
      # checkout's moon.mod and therefore resolves its current dependencies.
      - name: Materialize workspace dependencies
        run: |
          (cd sdk && moon update && moon check --target wasm src/cmd/passport)
          (cd template && moon update && moon check --target native)
          (cd no-audio && moon update)

      - name: Template checks against the current SDK
        run: |
          moon check --target native --output-json
          moon test --target native --output-json
        working-directory: template

      - name: Current-template Web build through the current SDK CLI
        run: |
          (cd "$AI_PASSPORT_SDK" && moon run --target wasm src/cmd/passport -- \
            build --host web --project "$GITHUB_WORKSPACE/template")
          test -f template/.passport/web/app.wasm
          test -f template/.passport/web/index.html
          test -f template/.passport/web/passport-host.js
          test -f template/.passport/web/pcm-worklet.js
          test -f template/.passport/web/assets/forest_walk.pcm
          cmp template/assets/forest_walk.pcm template/.passport/web/assets/forest_walk.pcm

      # Container steps default to plain sh; IDF's export.sh and pipefail
      # need bash (present in the image).
      - name: Current-template device build (ESP-IDF 5.5.3, no flash)
        shell: bash
        run: |
          set -eo pipefail
          . /opt/esp/idf/export.sh
          (cd "$AI_PASSPORT_SDK" && moon run --target wasm src/cmd/passport -- \
            build --host folotoy-ai-passport --project "$GITHUB_WORKSPACE/template") | tee /tmp/device-build.log
          test -f template/.passport/folotoy-ai-passport/build/ai_passport_app.bin
          grep -q "dependency: .*/external/folotoy-ai-passport @ c21a015d44f2bcc02b4d859532d74cd7aefe69be (project-provided)" /tmp/device-build.log
          size=$(stat -c %s template/.passport/folotoy-ai-passport/build/ai_passport_app.bin)
          test "$size" -gt 0 -a "$size" -le 3670016
          margin="$(grep -oE 'app partition margin: [0-9]+ bytes' /tmp/device-build.log | head -n1 || true)"
          test -n "$margin"
          echo "firmware size: $size / 3670016 bytes (0x380000 app partition)"
          echo "passport: $margin"

      # Pre-release migration proof: a CI-side copy of the current template
      # with ONLY its runtime-adapter boundary replaced by the single-entry
      # contract (the transform lives in this repo, never in the template).
      # Green means the published template is ready to migrate to 0.0.6.
      - name: Single-entry transform of the current template (web + device)
        shell: bash
        run: |
          set -eo pipefail
          bash "$AI_PASSPORT_SDK/.github/scripts/template-single-entry.sh" \
            "$GITHUB_WORKSPACE/template" "$GITHUB_WORKSPACE/template-single"
          cat > "$GITHUB_WORKSPACE/moon.work" <<'EOF'
          members = [
            "sdk",
            "template",
            "template-single",
            "no-audio",
          ]
          EOF
          cd "$GITHUB_WORKSPACE/template-single"
          moon update
          test ! -d src/runtime_wasm -a ! -d src/runtime_native
          # The migrated project stays a normal MoonBit project: the source
          # root and every authored import are untouched.
          grep -qx 'source = "src"' moon.mod
          grep -qx 'entry = "app"' passport.toml
          grep -q '^deviceEntry[[:space:]]*=' passport.toml && exit 1 || true
          grep -q '"colmugx/ai-passport-template/forest_walk"' src/app/moon.pkg
          moon check --target native --output-json
          moon test --target native --output-json
          (cd "$AI_PASSPORT_SDK" && moon run --target wasm src/cmd/passport -- \
            build --host web --project "$GITHUB_WORKSPACE/template-single")
          test -f "$GITHUB_WORKSPACE/template-single/.passport/web/app.wasm"
          test -f "$GITHUB_WORKSPACE/template-single/src/passport-generated/web/moon.pkg"
          test -f "$GITHUB_WORKSPACE/template-single/src/passport-generated/web/adapter.mbt"
          cmp "$GITHUB_WORKSPACE/template-single/assets/forest_walk.pcm" \
            "$GITHUB_WORKSPACE/template-single/.passport/web/assets/forest_walk.pcm"
          . /opt/esp/idf/export.sh
          (cd "$AI_PASSPORT_SDK" && moon run --target wasm src/cmd/passport -- \
            build --host folotoy-ai-passport --project "$GITHUB_WORKSPACE/template-single") | tee /tmp/single-entry-device.log
          grep -q "generated the FoloToy entry adapter" /tmp/single-entry-device.log
          test -f "$GITHUB_WORKSPACE/template-single/.passport/folotoy-ai-passport/build/ai_passport_app.bin"
          grep -q "dependency: .*/external/folotoy-ai-passport @ c21a015d44f2bcc02b4d859532d74cd7aefe69be (project-provided)" /tmp/single-entry-device.log
          size=$(stat -c %s "$GITHUB_WORKSPACE/template-single/.passport/folotoy-ai-passport/build/ai_passport_app.bin")
          test "$size" -gt 0 -a "$size" -le 3670016
          echo "single-entry template firmware size: $size / 3670016 bytes"

      # Release invariant for optional PCM: an application with no audio
      # asset is a valid FoloToy application. The fixture declares no
      # hostDependencies, so this also exercises the CLI-managed pinned
      # FoloToy clone. No asset generation, no flash. The same fixture also
      # proves the single-entry contract on the Web Host.
      - name: No-audio fixture (single entry, web bundle + ESP-IDF firmware)
        shell: bash
        run: |
          set -eo pipefail
          fixture="$GITHUB_WORKSPACE/no-audio"
          (cd "$fixture" && moon check --target native --output-json && moon check --target wasm --output-json)
          (cd "$AI_PASSPORT_SDK" && moon run --target wasm src/cmd/passport -- \
            build --host web --project "$fixture") | tee /tmp/no-audio-web.log
          test -f "$fixture/.passport/web/app.wasm"
          test -f "$fixture/.passport/web/index.html"
          test -f "$fixture/src/passport-generated/web/moon.pkg"
          grep -q "generated the Web entry adapter" /tmp/no-audio-web.log
          . /opt/esp/idf/export.sh
          (cd "$AI_PASSPORT_SDK" && moon run --target wasm src/cmd/passport -- \
            build --host folotoy-ai-passport --project "$fixture") | tee /tmp/no-audio-build.log
          test -f "$fixture/.passport/folotoy-ai-passport/build/ai_passport_app.bin"
          grep -q "no pcmLoop asset declared; firmware embeds no application music" /tmp/no-audio-build.log
          grep -q "folotoy-ai-passport dependency: .* @ c21a015d44f2bcc02b4d859532d74cd7aefe69be (CLI-managed)" /tmp/no-audio-build.log
          test ! -e "$fixture/.passport/folotoy-ai-passport/passport_music.pcm"
          size=$(stat -c %s "$fixture/.passport/folotoy-ai-passport/build/ai_passport_app.bin")
          test "$size" -gt 0 -a "$size" -le 3670016
          margin="$(grep -oE 'app partition margin: [0-9]+ bytes' /tmp/no-audio-build.log | head -n1 || true)"
          test -n "$margin"
          echo "no-audio firmware size: $size / 3670016 bytes (0x380000 app partition)"
          echo "passport: $margin"
